  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f7fb;
      color: #1f2a3a;
      padding-bottom: 80px;
    }
    .navbar {
      background: linear-gradient(135deg, #0a2e5c 0%, #1a4a7a 100%);
      color: white;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(10, 46, 92, 0.3);
    }
    .navbar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto;
      gap: 12px;
    }
    .navbar-left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .navbar-left .brand-icon { font-size: 28px; color: #ffb347; }
    .navbar-left .brand-text { font-weight: 700; font-size: 20px; letter-spacing: 1px; }
    .navbar-left .brand-sub { font-size: 12px; opacity: 0.8; font-weight: 400; margin-left: 6px; }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 179, 71, 0.18);
      border: 1px solid rgba(255, 179, 71, 0.4);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #ffd9a0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .navbar-right i { color: #ffb347; font-size: 13px; }

    .container { max-width: 820px; margin: 0 auto; padding: 16px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .step-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .step-item:hover { transform: translateY(-2px); }
    .step-item .step-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e0e6ed;
      color: #7a8a9e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px; font-weight: 700;
      transition: all 0.3s;
      border: 2px solid transparent;
      position: relative;
      z-index: 2;
    }
    .step-item.active .step-circle {
      background: #0a2e5c;
      color: white;
      border-color: #ffb347;
      box-shadow: 0 0 0 4px rgba(10, 46, 92, 0.15);
    }
    .step-item.done .step-circle { background: #1e7e34; color: white; }
    .step-item .step-label {
      font-size: 11px;
      margin-top: 6px;
      color: #7a8a9e;
      text-align: center;
      font-weight: 500;
    }
    .step-item.active .step-label { color: #0a2e5c; font-weight: 700; }
    .step-item.done .step-label { color: #1e7e34; font-weight: 600; }
    .step-item .step-line {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: #e0e6ed;
      z-index: 0;
    }
    .step-item:last-child .step-line { display: none; }
    .step-item.done + .step-item .step-line { background: #1e7e34; }

    .progress-bar-wrap {
      background: #e9edf2;
      border-radius: 20px;
      height: 6px;
      margin: 6px 0 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #0a2e5c, #2d6da8);
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: #4a5a6e; text-align: right; }

    .dept-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: #f8faff;
      border-radius: 12px;
      margin-bottom: 18px;
      border-left: 5px solid #0a2e5c;
    }
    .dept-header .dept-icon { font-size: 28px; color: #0a2e5c; }
    .dept-header .dept-info h3 { font-size: 18px; font-weight: 700; color: #0a2e5c; }
    .dept-header .dept-info p { font-size: 13px; color: #5a6a7e; margin-top: 2px; }

    .question-block {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f2f5;
    }
    .question-block:last-child { border-bottom: none; margin-bottom: 0; }
    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .q-number {
      background: #eef3f9;
      color: #0a2e5c;
      font-weight: 700;
      font-size: 13px;
      min-width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; color: #1a2a3a; }

    .legal-tip {
      margin: 8px 0 12px 38px;
      background: #f8f9fc;
      border-left: 3px solid #ffb347;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      color: #3a4a5e;
      line-height: 1.6;
      transition: all 0.2s;
      cursor: pointer;
    }
    .legal-tip .tip-icon { color: #b8580a; margin-right: 6px; }
    .legal-tip .tip-toggle { float: right; color: #8a9aae; font-size: 12px; }
    .legal-tip.collapsed .tip-content { display: none; }

    .options { margin-left: 38px; display: flex; flex-direction: column; gap: 8px; }
    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #fafbfc;
      border-radius: 10px;
      border: 1.5px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
    }
    .option-item:hover { background: #f0f4fa; }
    .option-item.selected { background: #e8eff8; border-color: #0a2e5c; }
    .option-item input[type="radio"] {
      width: 18px; height: 18px;
      accent-color: #0a2e5c;
      flex-shrink: 0;
      cursor: pointer;
    }
    .option-item label {
      font-size: 14px;
      color: #1f2a3a;
      cursor: pointer;
      flex: 1;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      min-width: 100px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: #0a2e5c; color: white; }
    .btn-primary:hover { background: #123f72; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10,46,92,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-outline { background: transparent; color: #4a5a6e; border: 1.5px solid #d0d7e0; }
    .btn-outline:hover { background: #f0f2f5; }
    .btn-success { background: #1e7e34; color: white; }
    .btn-success:hover { background: #166d2a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,126,52,0.3); }

    #resultPage { display: none; }
    .result-health { text-align: center; padding: 16px 0; }
    .result-health .big-icon { font-size: 64px; margin-bottom: 8px; }
    .result-health .grade { font-size: 28px; font-weight: 800; letter-spacing: 2px; }
    .result-health .sub { font-size: 15px; color: #4a5a6e; margin-top: 4px; }
    .result-score {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .result-score .score-item { text-align: center; }
    .result-score .score-item .num { font-size: 22px; font-weight: 700; color: #0a2e5c; }
    .result-score .score-item .label { font-size: 12px; color: #6b7a8f; }
    .result-dept {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 12px 0;
    }
    .result-dept .dept-card {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 4px solid #ccc;
    }
    .result-dept .dept-card .dname { font-size: 13px; font-weight: 600; color: #1f2a3a; }
    .result-dept .dept-card .dlevel { font-size: 12px; margin-top: 4px; }
    .level-low { color: #1e7e34; }
    .level-mid { color: #b8580a; }
    .level-high { color: #b3362a; }

    .risk-item {
      padding: 16px 18px;
      background: #fafbfc;
      border-radius: 10px;
      margin-bottom: 12px;
      border-left: 4px solid #ccc;
    }
    .risk-item .rtop {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .risk-item .rtop .rtitle {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
      min-width: 200px;
      color: #1a2a3a;
    }
    .risk-item .rtop .rtag {
      font-size: 11px; font-weight: 600; padding: 2px 12px; border-radius: 20px;
      white-space: nowrap;
    }
    .risk-item .rdept {
      font-size: 12px;
      color: #6b7a8f;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .risk-item .rchoice {
      font-size: 13px;
      color: #1a2a3a;
      background: #fff;
      border: 1px dashed #d0d7e0;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .risk-item .rchoice .rchoice-label {
      color: #6b7a8f;
      margin-right: 6px;
    }
    .risk-item .rchoice .rchoice-value {
      font-weight: 600;
      color: #b3362a;
    }
    .risk-item .rdesc {
      font-size: 13px;
      color: #4a5a6e;
      margin: 6px 0;
      line-height: 1.6;
    }
    .risk-item .rsugg {
      font-size: 13px;
      color: #0a2e5c;
      background: #e8eff8;
      padding: 8px 12px;
      border-radius: 6px;
      display: block;
      margin-top: 8px;
      line-height: 1.5;
    }
    .report-meta {
      font-size: 13px;
      color: #6b7a8f;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      border-top: 1px solid #e9edf2;
      padding-top: 12px;
      margin-top: 12px;
    }
    .disclaimer {
      font-size: 12px;
      color: #8a9aae;
      background: #f8f9fc;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .footer-note {
      text-align: center;
      color: #8a9aae;
      font-size: 12px;
      padding: 20px 0 10px;
      border-top: 1px solid #e9edf2;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .navbar-left .brand-sub { display: none; }
      .navbar-left .brand-text { font-size: 17px; }
      .navbar-right { font-size: 11px; padding: 4px 10px; }
      .result-dept { grid-template-columns: 1fr; }
      .options { margin-left: 0; }
      .legal-tip { margin-left: 0; }
      .step-item .step-label { font-size: 10px; }
      .btn { font-size: 14px; padding: 10px 18px; }
      .result-score { gap: 16px; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="navbar-content">
    <div class="navbar-left">
      <span class="brand-icon"><i class="fas fa-heartbeat"></i></span>
      <span class="brand-text">检护黎商 <span class="brand-sub">· 法治体检中心</span></span>
    </div>
    <div class="navbar-right">
      <i class="fas fa-info-circle"></i>
      <span>完成全部题目后生成体检报告</span>
    </div>
  </div>
</div>

<div class="container" id="app">
  <div class="card" style="padding-bottom: 12px;">
    <div class="step-indicator" id="stepIndicator"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <div id="questionArea">
    <div class="card" id="deptHeader"></div>
    <div class="card" id="questionsContainer"></div>
    <div class="card">
      <div class="btn-group">
        <button class="btn btn-outline" id="prevBtn" onclick="prevStep()"><i class="fas fa-chevron-left"></i> 上一板块</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">下一板块 <i class="fas fa-chevron-right"></i></button>
        <button class="btn btn-success hidden" id="submitBtn" onclick="submitQuiz()"><i class="fas fa-file-medical-alt"></i> 生成体检报告</button>
      </div>
    </div>
  </div>

  <div id="resultPage">
    <div class="card" id="resultContent"></div>
    <div class="card">
      <div class="btn-group">
        <button class="btn btn-outline" onclick="resetQuiz()"><i class="fas fa-redo"></i> 重新体检</button>
        <button class="btn btn-primary" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> 重新下载PDF</button>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> 黎川县人民检察院 · 检护黎商 ｜ 数据仅用于法治服务，严格保密
  </div>
</div>

<script>
const DEPTS = [
  { id: 'criminal', name: '刑事检察', icon: 'fa-gavel', color: '#b3362a' },
  { id: 'civil', name: '民事检察', icon: 'fa-file-contract', color: '#1a5a8a' },
  { id: 'administrative', name: '行政检察', icon: 'fa-building', color: '#b8580a' },
  { id: 'public', name: '公益诉讼检察', icon: 'fa-globe-asia', color: '#1e6a34' }
];

const QUESTIONS = {
  criminal: [
    { id: 'q1', text: '企业是否建立了完善的财务管理制度，做到资金审批、支付、记账岗位相互分离？', options: ['已建立并严格执行', '已建立但执行不到位', '尚未建立', '不清楚'], legalTip: '根据《中华人民共和国刑法》第二百七十一条，公司、企业或者其他单位的工作人员，利用职务上的便利，将本单位财物非法占为己有，数额较大的，构成职务侵占罪。财务管理制度的缺失或执行不力，是企业内部人员实施职务侵占的重要诱因。建立规范的财务审批和岗位分离制度，是防范此类刑事风险的基础防线。' },
    { id: 'q2', text: '企业是否建立了采购、销售、招投标等关键岗位的廉洁管理制度或定期轮岗制度？', options: ['已建立廉洁制度/轮岗制度', '有制度但未有效执行', '未建立', '不清楚'], legalTip: '根据《中华人民共和国刑法》第一百六十三条，公司、企业或者其他单位的工作人员，利用职务上的便利，索取他人财物或者非法收受他人财物，为他人谋取利益，数额较大的，构成非国家工作人员受贿罪。采购、销售、招投标等环节是商业贿赂的高发领域，健全廉洁管理制度是防范此类犯罪的关键。' },
    { id: 'q3', text: '企业是否建立了商业秘密保护制度（如保密协议、涉密信息分级管理、离职人员脱密管理等）？', options: ['已建立并有效执行', '部分建立', '未建立', '不清楚'], legalTip: '根据《中华人民共和国刑法》第二百一十九条，以盗窃、利诱、胁迫或者其他不正当手段获取权利人的商业秘密，或者非法披露、使用、允许他人使用其所掌握的或获取的商业秘密，给商业秘密的权利人造成重大损失的，构成侵犯商业秘密罪。技术密集型企业尤其应当重视商业秘密的制度化保护。' },
    { id: 'q4', text: '企业是否存在为他人虚开、代开增值税专用发票或普通发票的情形？', options: ['不存在', '偶尔存在', '经常存在', '不清楚'], legalTip: '根据《中华人民共和国刑法》第二百零五条，虚开增值税专用发票或者虚开用于骗取出口退税、抵扣税款的其他发票的，构成虚开增值税专用发票罪。虚开发票行为不仅面临行政处罚，达到一定数额还将追究刑事责任。企业应严格规范发票管理，杜绝任何形式的虚开发票行为。' },
    { id: 'q5', text: '企业是否按照《税收征收管理法》的规定，如实进行纳税申报并按时缴纳税款？', options: ['是，依法如实申报缴纳', '存在少报、漏报情况', '存在故意不申报情况', '不清楚'], legalTip: '根据《中华人民共和国税收征收管理法》第六十三条，纳税人伪造、变造、隐匿、擅自销毁账簿、记账凭证，或者在账簿上多列支出或者不列、少列收入，或者经税务机关通知申报而拒不申报或者进行虚假的纳税申报，不缴或者少缴应纳税款的，是偷税。对纳税人偷税的，由税务机关追缴其不缴或者少缴的税款、滞纳金，并处不缴或者少缴的税款百分之五十以上五倍以下的罚款；构成犯罪的，依法追究刑事责任。' },
    { id: 'q6', text: '企业在参与招投标或商业合作过程中，是否存在围标、串标、提供虚假材料等行为？', options: ['不存在', '偶尔存在', '不清楚'], legalTip: '根据《中华人民共和国刑法》第二百二十三条，投标人相互串通投标报价，损害招标人或者其他投标人利益，情节严重的，或者投标人与招标人串通投标，损害国家、集体、公民的合法利益的，构成串通投标罪。根据《反不正当竞争法》第七条，经营者不得采用贿赂等手段谋取交易机会或者竞争优势。企业在招投标活动中应当严格遵守公平竞争原则，杜绝任何不正当竞争行为。' },
    { id: 'q7', text: '企业在与客户、供应商等交易过程中，是否存在为获取交易机会而给予对方财物或其他不正当利益的行为？', options: ['不存在', '存在个别现象', '不清楚'], legalTip: '根据《中华人民共和国反不正当竞争法》第七条，经营者不得采用财物或者其他手段贿赂下列单位或者个人，以谋取交易机会或者竞争优势。商业贿赂不仅面临高额行政处罚，情节严重的还可能构成刑事犯罪。' },
    { id: 'q8', text: '企业是否建立合同签订前的交易对手资信审查制度，防范合同诈骗风险？', options: ['已建立并严格执行', '已建立但执行不到位', '未建立', '不清楚'], legalTip: '根据《中华人民共和国刑法》第二百二十四条，以虚构的单位或者冒用他人名义签订合同，以伪造、变造、作废的票据或者其他虚假的产权证明作担保，没有实际履行能力而以先履行小额合同或者部分履行合同的方法诱骗对方当事人继续签订和履行合同等手段，收受对方当事人给付的货物、货款、预付款或者担保财产后逃匿的，构成合同诈骗罪。企业应当建立规范的交易对手审查制度，防范合同诈骗风险。' },
    { id: 'q9', text: '企业是否对商业合作伙伴的资质、信誉进行必要的背景调查？', options: ['是，逐笔核查', '部分核查', '未核查', '不清楚'], legalTip: '根据《中华人民共和国民法典》关于合同相对性原则的规定（第四百六十五条），合同通常只能约束签订合同的各方当事人。为防范交易风险，签订合同时应当明确合同当事人，认真审查拟建立合同关系的相对方的代表身份、代理手续，要求对方法定代表人或有代理权限的委托代理人签字、企业盖章。缺乏必要的背景调查，可能导致企业与不具备履约能力或存在不良记录的主体交易，带来重大经济损失。' }
  ],
  civil: [
    { id: 'q10', text: '企业是否按照《公司法》的规定制定了公司章程，并明确了股东会、董事会（执行董事）、监事会（监事）的职权和议事规则？', options: ['是，章程完善且机构健全', '有章程但机构设置不健全', '章程过于简略或照搬模板', '不清楚'], legalTip: '根据2024年7月施行的新《中华人民共和国公司法》，公司应当依法制定公司章程，明确公司治理结构。新《公司法》优化了公司治理制度，明确了董事会、监事会、审计委员会等组织机构设置的相关规定。公司章程是公司的“宪法”，过于简略或照搬模板的章程难以有效规范公司治理，容易引发股东纠纷和决策僵局。' },
    { id: 'q11', text: '企业股东认缴的注册资本是否在法定期限内完成实缴？', options: ['已全部实缴或在法定期限内', '部分未实缴', '大部分未实缴', '不清楚'], legalTip: '根据新《中华人民共和国公司法》第四十七条，全体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起五年内缴足。2024年6月30日前登记设立的公司，剩余认缴出资期限自2027年7月1日起超过5年的，应当在2027年6月30日前调整至5年内。未按期实缴出资的，股东可能面临失权等法律后果。' },
    { id: 'q12', text: '企业与交易相对方签订的重大合同（如购销、投资、担保、技术合作等），是否经法务人员或法律顾问审核？', options: ['全部审核', '部分审核', '未审核', '未聘请法律顾问/法务人员'], legalTip: '根据《中华人民共和国民法典》第四百六十五条，依法成立的合同，受法律保护。但合同条款设置不当、审查流程不规范，可能引发法律争议和经济损失。合同应当明确约定双方权利义务、违约责任、争议解决方式等关键条款。缺乏专业审核的合同容易留下法律隐患。' },
    { id: 'q13', text: '企业是否建立了合同履行跟踪制度，对合同履行情况进行动态管理？', options: ['已建立并有效执行', '已建立但执行不到位', '未建立', '不清楚'], legalTip: '根据《中华人民共和国民法典》第五百七十七条，当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。建立合同履行跟踪制度有助于及时发现违约风险、固定证据、维护企业合法权益。' },
    { id: 'q14', text: '企业近三年是否发生过货款被拖欠、合同违约等纠纷？', options: ['未发生', '发生过1-2起', '发生过3起及以上', '不清楚'], legalTip: '根据《中华人民共和国民法典》第一百八十八条，向人民法院请求保护民事权利的诉讼时效期间为三年。企业应当注意诉讼时效问题，通过规范使用催款函等方式及时中断时效、保全债权。合同纠纷频发提示企业合同管理和风控能力存在不足，应当引起重视。' },
    { id: 'q15', text: '企业是否与所有在职员工签订了书面劳动合同？', options: ['全部签订', '大部分签订（80%以上）', '少部分签订', '未签订'], legalTip: '根据《中华人民共和国劳动合同法》第十条，建立劳动关系，应当订立书面劳动合同。根据第八十二条，用人单位自用工之日起超过一个月不满一年未与劳动者订立书面劳动合同的，应当向劳动者每月支付二倍的工资。未签订书面劳动合同是企业面临劳动仲裁和诉讼的常见原因，法律后果严重。' },
    { id: 'q16', text: '企业是否为全体员工依法缴纳社会保险（养老、医疗、工伤、失业、生育保险）？', options: ['全员全额缴纳', '部分人员缴纳', '未缴纳', '不清楚'], legalTip: '根据《中华人民共和国劳动法》第三条，劳动者享有享受社会保险和福利的权利。根据《劳动法》第一百条，用人单位无故不缴纳社会保险费的，由劳动行政部门责令其限期缴纳；逾期不缴的，可以加收滞纳金。未依法缴纳社会保险不仅面临行政处罚，还可能引发劳动争议和群体性纠纷。' },
    { id: 'q17', text: '企业是否建立了安全生产和职业健康管理制度？', options: ['已建立并定期组织培训', '已建立但执行不到位', '未建立', '不清楚'], legalTip: '根据《中华人民共和国安全生产法》第五条，生产经营单位的主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。根据第二十一条，主要负责人负有建立健全并落实本单位全员安全生产责任制、组织制定并实施本单位安全生产规章制度和操作规程等法定职责。安全生产管理制度的缺失可能引发安全生产事故，造成人员伤亡和重大经济损失，相关责任人还将面临刑事责任。' },
    { id: 'q18', text: '企业近三年是否发生过劳动争议仲裁或诉讼案件？', options: ['未发生', '发生过1-2起', '发生过3起及以上', '不清楚'], legalTip: '劳动争议频发不仅增加企业诉讼成本，还可能影响企业声誉和员工稳定性。劳动用工合规是企业合规管理的基础内容，应当引起高度重视。' },
    { id: 'q19', text: '企业是否对自主创新的技术成果、品牌标识等及时申请专利、商标注册或进行著作权登记？', options: ['已申请/登记', '正在申请中', '未申请', '不清楚'], legalTip: '根据《中华人民共和国专利法》第十一条，发明和实用新型专利权被授予后，任何单位或者个人未经专利权人许可，都不得为生产经营目的制造、使用、许诺销售、销售、进口其专利产品。未及时进行知识产权确权，企业将面临核心技术被仿冒、品牌被侵权的风险，且维权缺乏权利基础。' },
    { id: 'q20', text: '企业是否建立了保密制度，对核心技术信息、客户名单、经营策略等商业秘密采取保护措施？', options: ['已建立并有效执行', '部分建立', '未建立', '不清楚'], legalTip: '根据《中华人民共和国反不正当竞争法》第九条，经营者不得实施侵犯商业秘密的行为。根据《中华人民共和国刑法》第二百一十九条，侵犯商业秘密情节严重的，构成侵犯商业秘密罪。商业秘密是企业的重要无形资产，缺乏有效保护措施将面临被窃取和滥用的风险。' },
    { id: 'q21', text: '企业是否遭遇过知识产权被侵犯（如仿冒产品、专利侵权、商标侵权等）的情形？', options: ['未遭遇', '遭遇过但未维权', '遭遇过并已维权', '不清楚'], legalTip: '根据《中华人民共和国专利法》第十一条和《中华人民共和国商标法》第五十七条，知识产权权利人有权依法追究侵权人的法律责任。遭遇侵权后消极不维权，不仅造成直接经济损失，还可能助长侵权行为蔓延。企业应当建立知识产权维权意识和机制。' }
  ],
  administrative: [
    { id: 'q22', text: '企业的营业执照、行业经营许可证等经营证照是否齐全且在有效期内？', options: ['全部齐全且在有效期内', '部分证照即将到期（3个月内）', '部分证照已过期', '不清楚'], legalTip: '根据《优化营商环境条例》第九条，市场主体应当遵守法律法规，履行安全、质量等方面的法定义务。无证经营或证照过期经营属于违法行为，可能面临行政处罚乃至刑事追究。企业应当建立证照到期预警机制，及时办理延续手续。' },
    { id: 'q23', text: '企业是否按规定办理了排污许可登记或取得了排污许可证？', options: ['已取得排污许可证', '已登记但未取得许可证', '未登记也未取得', '不适用（无排放）'], legalTip: '根据《排污许可管理条例》相关规定，依照法律规定实行排污许可管理的企业事业单位和其他生产经营者，应当申请取得排污许可证；未取得排污许可证的，不得排放污染物。未依法取得排污许可证排放污染物的，将面临责令改正、限制生产、停产整治乃至罚款等行政处罚。' },
    { id: 'q24', text: '企业生产经营场所是否通过消防验收或备案？', options: ['已通过消防验收', '已备案但未验收', '未验收也未备案', '不清楚'], legalTip: '根据《中华人民共和国消防法》相关规定，按照国家工程建设消防技术标准需要进行消防设计的建设工程竣工，应当依法进行消防验收或者备案；未经消防验收或者消防验收不合格的，禁止投入使用。消防验收不合格的建筑物投入使用，一旦发生火灾事故，企业及相关责任人将面临严重的法律后果。' },
    { id: 'q25', text: '企业是否制定消防安全制度、灭火和应急疏散预案，并定期组织消防演练？', options: ['已制定并定期演练', '已制定但未演练', '未制定', '不清楚'], legalTip: '根据《中华人民共和国消防法》第十六条，机关、团体、企业、事业等单位应当履行消防安全职责，包括落实消防安全责任制、制定消防安全制度和操作规程、制定灭火和应急疏散预案、组织防火检查等。未履行消防安全职责的，将面临行政处罚；造成严重后果的，相关责任人可能被追究刑事责任。' },
    { id: 'q26', text: '企业近三年是否因消防或安全生产问题受到过行政处罚？', options: ['未受过处罚', '受过1次处罚', '受过2次及以上', '不清楚'], legalTip: '根据《中华人民共和国安全生产法》相关规定，生产经营单位未履行安全生产保障义务的，将面临责令改正、罚款、停产停业整顿等行政处罚。多次受到行政处罚提示企业存在系统性安全管理问题，应当进行全面排查整改。' },
    { id: 'q27', text: '企业生产经营活动是否配套建设了污染防治设施并确保正常运行？', options: ['已配套并正常运行', '已配套但运行不正常', '未配套', '不适用（无污染排放）'], legalTip: '根据《中华人民共和国环境保护法》第四十二条，排放污染物的企业事业单位和其他生产经营者，应当采取措施，防治在生产建设或者其他活动中产生的废气、废水、废渣、医疗废物、粉尘、恶臭气体、放射性物质以及噪声、振动、光辐射、电磁辐射等对环境的污染和危害。污染防治设施未建成、未经验收或者验收不合格，主体工程即投入生产或者使用的，将面临行政处罚。' },
    { id: 'q28', text: '企业是否依法处置生产经营活动中产生的危险废物？', options: ['全部交由有资质的单位处置', '部分交由有资质的单位处置', '自行处理或随意处置', '不适用（无危险废物产生）'], legalTip: '根据《中华人民共和国固体废物污染环境防治法》相关规定，产生危险废物的单位，应当按照国家有关规定制定危险废物管理计划；建立危险废物管理台账，如实记录有关信息；按照国家有关规定和环境保护标准要求贮存、利用、处置危险废物，不得擅自倾倒、堆放。将危险废物提供或者委托给无许可证的单位或者其他生产经营者从事经营活动的，将面临严厉的行政处罚。' },
    { id: 'q29', text: '企业近三年是否因环保问题受到过行政处罚或被责令整改？', options: ['未受过处罚/未被责令整改', '受过1次处罚或整改', '受过2次及以上', '不清楚'], legalTip: '环保行政处罚记录不仅影响企业信用评级，还可能影响企业融资、上市、参与招投标等经营活动。多次被处罚的企业应当进行全面环保合规审查，建立长效管理机制。' }
  ],
  public: [
    { id: 'q30', text: '企业生产经营活动是否存在超标排放废气、废水、噪声等污染环境的行为？', options: ['不存在', '偶尔存在', '不清楚'], legalTip: '根据《中华人民共和国环境保护法》第六十条，企业事业单位和其他生产经营者超过污染物排放标准或者超过重点污染物排放总量控制指标排放污染物的，县级以上人民政府环境保护主管部门可以责令其采取限制生产、停产整治等措施；情节严重的，报经有批准权的人民政府批准，责令停业、关闭。环境污染行为还可能引发环境公益诉讼，企业将面临巨额赔偿和修复费用。' },
    { id: 'q31', text: '企业是否按照环保部门要求安装了污染物排放自动监测设备并保证其正常运行？', options: ['已安装并正常运行', '已安装但运行不正常', '未安装', '不适用'], legalTip: '根据《中华人民共和国环境保护法》第四十二条，重点排污单位应当按照国家有关规定和监测规范安装使用监测设备，保证监测设备正常运行，保存原始监测记录。严禁通过暗管、渗井、渗坑、灌注或者篡改、伪造监测数据，或者不正常运行防治污染设施等逃避监管的方式违法排放污染物。' },
    { id: 'q32', text: '企业是否建立了产品质量检测制度，确保出厂产品符合国家或行业质量标准？', options: ['已建立并严格执行', '已建立但执行不到位', '未建立', '不清楚'], legalTip: '根据《中华人民共和国产品质量法》第十二条，产品质量应当检验合格，不得以不合格产品冒充合格产品。产品质量不合格不仅面临行政处罚和民事赔偿，造成严重后果的还可能涉及生产、销售伪劣产品罪等刑事责任。' },
    { id: 'q33', text: '企业是否明确告知消费者产品的安全使用说明、注意事项、保质期或有效期限？', options: ['全部产品均有明确标注', '部分产品有标注', '未标注', '不适用'], legalTip: '根据《中华人民共和国消费者权益保护法》第八条，消费者享有知悉其购买、使用的商品或者接受的服务的真实情况的权利。根据第十八条，经营者应当保证其提供的商品或者服务符合保障人身、财产安全的要求。未履行告知义务导致消费者损害的，企业将承担相应的法律责任。' },
    { id: 'q34', text: '企业近三年是否发生过产品质量投诉、退货或被市场监管部门查处的情况？', options: ['未发生', '发生过少量投诉已处理', '发生过被查处的情况', '不清楚'], legalTip: '产品质量问题频发不仅损害消费者权益，还可能引发行政调查、民事索赔乃至公益诉讼。企业应当建立产品质量追溯体系和投诉处理机制，及时发现和纠正质量问题。' },
    { id: 'q35', text: '企业生产经营场所是否存在违规占用、堵塞、封闭疏散通道、安全出口等影响公共安全的行为？', options: ['不存在', '偶尔存在', '不清楚'], legalTip: '根据《中华人民共和国消防法》第二十八条，任何单位、个人不得占用、堵塞、封闭疏散通道、安全出口、消防车通道。占用、堵塞、封闭疏散通道、安全出口或者有其他妨碍安全疏散行为的，将面临行政处罚。' },
    { id: 'q36', text: '企业是否按规定为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用？', options: ['全部配备并监督使用', '部分配备', '未配备', '不清楚'], legalTip: '根据《中华人民共和国安全生产法》第四十五条，生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。未按规定配备劳动防护用品，不仅面临行政处罚，一旦发生生产安全事故，企业还将承担赔偿责任，相关责任人可能被追究刑事责任。' }
  ]
};

let currentDeptIndex = 0;
const totalDepts = DEPTS.length;
const answers = {};
let currentReportId = '';

function getDeptQuestionIds(deptId) {
  return (QUESTIONS[deptId] || []).map(q => q.id);
}
function isDeptComplete(deptId) {
  const ids = getDeptQuestionIds(deptId);
  return ids.every(id => answers[id] !== undefined);
}
function calcProgress() {
  let total = 0, done = 0;
  for (const deptId in QUESTIONS) {
    QUESTIONS[deptId].forEach(q => { total++; if (answers[q.id] !== undefined) done++; });
  }
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

function renderSteps() {
  const container = document.getElementById('stepIndicator');
  let html = '';
  DEPTS.forEach((dept, idx) => {
    const isActive = idx === currentDeptIndex;
    const complete = isDeptComplete(dept.id);
    let extraClass = '';
    if (isActive) extraClass = 'active';
    else if (complete) extraClass = 'done';
    html += `
      <div class="step-item ${extraClass}" onclick="goToDept(${idx})" title="点击跳转到${dept.name}">
        <div class="step-circle">${(complete && !isActive) ? '<i class="fas fa-check"></i>' : (idx+1)}</div>
        <div class="step-label">${dept.name}</div>
        <div class="step-line"></div>
      </div>
    `;
  });
  container.innerHTML = html;
  updateProgress();
}

function goToDept(idx) {
  if (idx === currentDeptIndex) return;
  currentDeptIndex = idx;
  renderDeptHeader();
  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  const pct = calcProgress();
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

function renderDeptHeader() {
  const dept = DEPTS[currentDeptIndex];
  const container = document.getElementById('deptHeader');
  const complete = isDeptComplete(dept.id);
  container.innerHTML = `
    <div class="dept-header" style="border-left-color: ${dept.color};">
      <div class="dept-icon"><i class="fas ${dept.icon}"></i></div>
      <div class="dept-info">
        <h3>${dept.name}</h3>
        <p>共 ${QUESTIONS[dept.id].length} 题 ${complete ? '✅ 已答完' : '⏳ 待完成'}</p>
      </div>
    </div>
  `;
}

function renderQuestions() {
  const dept = DEPTS[currentDeptIndex];
  const qs = QUESTIONS[dept.id] || [];
  const container = document.getElementById('questionsContainer');
  let html = '';
  qs.forEach((q, idx) => {
    const selectedIdx = answers[q.id];
    const hasTip = q.legalTip && q.legalTip.length > 0;
    html += `<div class="question-block">`;
    html += `
      <div class="q-header">
        <div class="q-number">${idx + 1}</div>
        <div class="q-text">${q.text}</div>
      </div>
    `;
    if (hasTip) {
      html += `
        <div class="legal-tip" onclick="toggleTip(this)">
          <span class="tip-icon"><i class="fas fa-scale-balanced"></i></span>
          <span class="tip-toggle"><i class="fas fa-chevron-down"></i></span>
          <span class="tip-content">${q.legalTip}</span>
        </div>
      `;
    }
    html += `<div class="options">`;
    q.options.forEach((opt, oi) => {
      const checked = (selectedIdx === oi) ? 'checked' : '';
      html += `
        <div class="option-item ${checked ? 'selected' : ''}" onclick="selectOption('${q.id}', ${oi})">
          <input type="radio" name="${q.id}" value="${oi}" ${checked}>
          <label>${opt}</label>
        </div>
      `;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;

  const isLast = currentDeptIndex === totalDepts - 1;
  document.getElementById('submitBtn').classList.toggle('hidden', !isLast);
  document.getElementById('nextBtn').classList.toggle('hidden', isLast);
  document.getElementById('prevBtn').style.visibility = currentDeptIndex === 0 ? 'hidden' : 'visible';

  renderSteps();
}

function selectOption(qId, optionIdx) {
  answers[qId] = optionIdx;
  renderQuestions();
  renderDeptHeader();
  updateProgress();
}

function toggleTip(el) {
  el.classList.toggle('collapsed');
}

function nextStep() {
  if (currentDeptIndex < totalDepts - 1) {
    currentDeptIndex++;
    renderDeptHeader();
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevStep() {
  if (currentDeptIndex > 0) {
    currentDeptIndex--;
    renderDeptHeader();
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function generateReportId() {
  const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const randomStr = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
  return `LJ-${dateStr}-${randomStr}`;
}

function submitQuiz() {
  const incompleteDepts = [];
  DEPTS.forEach((dept, idx) => {
    if (!isDeptComplete(dept.id)) {
      incompleteDepts.push({ name: dept.name, index: idx });
    }
  });

  if (incompleteDepts.length > 0) {
    const names = incompleteDepts.map(d => `「${d.name}」`).join('、');
    const msg = `以下板块尚未答完：\n\n${names}\n\n是否立即前往第一个未答完的板块继续作答？`;
    if (confirm(msg)) {
      goToDept(incompleteDepts[0].index);
    }
    return;
  }

  currentReportId = generateReportId();
  const reportHTML = generateReport(currentReportId);
  document.getElementById('questionArea').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';
  document.getElementById('resultContent').innerHTML = reportHTML;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  setTimeout(() => {
    downloadPDF();
  }, 600);
}

function generateReport(reportId) {
  function evalDept(deptId) {
    const qs = QUESTIONS[deptId] || [];
    let score = 0, maxScore = qs.length * 2;
    qs.forEach(q => {
      const ans = answers[q.id];
      if (ans === undefined) return;
      const total = q.options.length;
      if (ans === 0) score += 2;
      else if (ans === total - 1) score += 0;
      else score += 1;
    });
    const pct = maxScore > 0 ? (score / maxScore) * 100 : 0;
    if (pct >= 70) return { level: '低风险', cls: 'level-low', icon: 'fa-check-circle', color: '#1e7e34' };
    if (pct >= 40) return { level: '中风险', cls: 'level-mid', icon: 'fa-exclamation-triangle', color: '#b8580a' };
    return { level: '高风险', cls: 'level-high', icon: 'fa-times-circle', color: '#b3362a' };
  }

  const deptResults = {};
  let totalScore = 0, totalMax = 0;
  DEPTS.forEach(d => {
    const result = evalDept(d.id);
    deptResults[d.id] = result;
    const qs = QUESTIONS[d.id] || [];
    totalMax += qs.length * 2;
    qs.forEach(q => {
      const ans = answers[q.id];
      if (ans === undefined) return;
      if (ans === 0) totalScore += 2;
      else if (ans === q.options.length - 1) totalScore += 0;
      else totalScore += 1;
    });
  });

  const overallPct = totalMax > 0 ? (totalScore / totalMax) * 100 : 0;
  let overallLevel, overallIcon, overallColor;
  if (overallPct >= 70) { overallLevel = '健康'; overallIcon = 'fa-smile'; overallColor = '#1e7e34'; }
  else if (overallPct >= 40) { overallLevel = '亚健康'; overallIcon = 'fa-meh'; overallColor = '#b8580a'; }
  else { overallLevel = '高危'; overallIcon = 'fa-frown'; overallColor = '#b3362a'; }

  // ========== 收集全部风险点（完整信息） ==========
  const riskItems = [];
  const deptMap = { criminal: '刑事检察', civil: '民事检察', administrative: '行政检察', public: '公益诉讼检察' };
  DEPTS.forEach(d => {
    const qs = QUESTIONS[d.id] || [];
    qs.forEach(q => {
      const ans = answers[q.id];
      if (ans === undefined) return;
      const total = q.options.length;
      if (ans === total - 1 || (ans > 1 && total > 3)) {
        riskItems.push({
          dept: deptMap[d.id] || d.name,
          deptColor: d.color,
          fullTitle: q.text,                      // 完整问题
          choiceText: q.options[ans],             // 用户选择的具体选项
          level: ans === total - 1 ? '高风险' : '中风险'
        });
      }
    });
  });

  // 按风险等级排序：高风险在前
  riskItems.sort((a, b) => (a.level === '高风险' ? -1 : 1) - (b.level === '高风险' ? -1 : 1));

  let html = `
    <div class="result-health">
      <div class="big-icon" style="color:${overallColor}"><i class="fas ${overallIcon}"></i></div>
      <div class="grade" style="color:${overallColor}">${overallLevel}</div>
      <div class="sub">综合健康等级 · 风险指数 ${Math.round(overallPct)}</div>
    </div>
    <div class="result-score">
      <div class="score-item"><div class="num">${DEPTS.length}</div><div class="label">板块检查</div></div>
      <div class="score-item"><div class="num">${Object.keys(answers).length}</div><div class="label">已答题目</div></div>
      <div class="score-item"><div class="num">${riskItems.length}</div><div class="label">发现风险点</div></div>
    </div>
    <div style="font-size:13px;color:#4a5a6e;text-align:center;margin:4px 0 8px;">
      报告编号：${reportId} ｜ 体检日期：${new Date().toLocaleDateString('zh-CN')}
    </div>
    <hr style="border:none;border-top:1px solid #e9edf2;margin:12px 0;">
    <h4 style="margin:10px 0 8px;"><i class="fas fa-stethoscope"></i> 各板块诊断</h4>
    <div class="result-dept">
  `;
  DEPTS.forEach(d => {
    const r = deptResults[d.id];
    html += `
      <div class="dept-card" style="border-left-color:${r.color}">
        <div class="dname">${d.name}</div>
        <div class="dlevel ${r.cls}"><i class="fas ${r.icon}"></i> ${r.level}</div>
      </div>
    `;
  });
  html += `</div>`;

  // ========== 风险清单：完整展示 ==========
  if (riskItems.length > 0) {
    html += `<h4 style="margin:20px 0 10px;"><i class="fas fa-exclamation-circle"></i> 风险清单与整改建议（共 ${riskItems.length} 项）</h4>`;
    html += `<div class="result-risk-list">`;
    riskItems.forEach((r, idx) => {
      const bg = r.level === '高风险' ? '#fee8e6' : '#fef0e0';
      const borderColor = r.level === '高风险' ? '#b3362a' : '#b8580a';
      const tagColor = r.level === '高风险' ? '#b3362a' : '#b8580a';

      html += `
        <div class="risk-item" style="border-left-color:${borderColor};">
          <div class="rtop">
            <span class="rtitle">${idx + 1}. ${r.fullTitle}</span>
            <span class="rtag" style="background:${bg};color:${tagColor}">${r.level}</span>
          </div>
          <div class="rdept">
            <i class="fas fa-stethoscope" style="color:${r.deptColor};"></i>
            <span>所属板块：${r.dept}</span>
          </div>
          <div class="rchoice">
            <span class="rchoice-label"><i class="fas fa-hand-pointer"></i> 您的选择：</span>
            <span class="rchoice-value">${r.choiceText}</span>
          </div>
          <div class="rdesc">
            <i class="fas fa-info-circle" style="color:#8a9aae;"></i>
            ${r.level === '高风险'
              ? '该选项表明企业当前存在较为突出的法律风险，可能面临行政处罚、民事责任乃至刑事追究，建议尽快整改。'
              : '该选项表明企业存在一定的法律风险隐患，建议对照相关法律规定完善管理制度，防患于未然。'}
          </div>
          <div class="rsugg">
            <i class="fas fa-prescription"></i>
            <strong>整改建议：</strong>请对照相关法律法规自查自纠，必要时可预约检察官上门深度体检，获取针对性合规指导。
          </div>
        </div>
      `;
    });
    html += `</div>`;
  } else {
    html += `<div style="text-align:center;padding:16px 0;color:#1e7e34;"><i class="fas fa-check-circle"></i> 未发现明显风险点，继续保持！</div>`;
  }

  html += `
    <div class="report-meta">
      <span><i class="fas fa-calendar-alt"></i> 生成时间：${new Date().toLocaleString('zh-CN')}</span>
      <span><i class="fas fa-building"></i> 黎川县人民检察院 · 检护黎商</span>
    </div>
    <div class="disclaimer">
      <i class="fas fa-info-circle"></i> 本报告基于问卷自动生成，仅供参考。如需精准诊断，建议预约检察官上门深度体检。
    </div>
  `;
  return html;
}

async function downloadPDF() {
  const element = document.getElementById('resultContent');
  const btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在生成PDF...'; }

  try {
    const canvas = await html2canvas(element, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pdfWidth - 20;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 10;

    pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
    heightLeft -= (pdfHeight - 20);

    while (heightLeft > 0) {
      position = heightLeft - imgHeight + 10;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
      heightLeft -= (pdfHeight - 20);
    }

    pdf.save(`检护黎商体检报告-${currentReportId}.pdf`);
  } catch (err) {
    console.error('PDF生成失败:', err);
    alert('PDF生成失败，请刷新页面重试。');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-file-pdf"></i> 重新下载PDF'; }
  }
}

function resetQuiz() {
  for (const key in answers) delete answers[key];
  currentDeptIndex = 0;
  currentReportId = '';
  document.getElementById('questionArea').style.display = 'block';
  document.getElementById('resultPage').style.display = 'none';
  renderDeptHeader();
  renderQuestions();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderDeptHeader();
renderQuestions();
updateProgress();

window.selectOption = selectOption;
window.nextStep = nextStep;
window.prevStep = prevStep;
window.goToDept = goToDept;
window.submitQuiz = submitQuiz;
window.resetQuiz = resetQuiz;
window.downloadPDF = downloadPDF;
window.toggleTip = toggleTip;
</script>
</body>
</html>
